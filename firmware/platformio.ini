[env:teensy41]
platform = teensy@6.0.0
board = teensy41
framework = arduino
platform_packages = platformio/framework-arduinoteensy@1.162.0
extra_scripts = pre:scripts/usbhost_enumeration.py
; Suppress PlatformIO's default USB_SERIAL preset and load our mouse profile.
build_flags =
    -D USB_DISABLED
    -include "src/mouse_usb_profile.h"
    -Wl,--wrap=usb_init,--wrap=usb_descriptor_list,--wrap=usb_descriptor_buffer
    -Wl,--wrap=usb_config_descriptor_12,--wrap=usb_config_descriptor_480
    -Wl,--wrap=usb_mouse_configure
lib_deps = ssilverman/QNEthernet@0.31.0
test_ignore = *

; Test the HID encoder and UDP protocol without an attached board.
[env:native]
platform = native
test_build_src = yes
build_src_filter = +<mouse_layout.cpp> +<usb_profile.cpp> +<mouse_action.cpp> +<device_kind.cpp> +<kind_mouse.cpp> +<kind_keyboard.cpp> +<kind_gamepad.cpp>
